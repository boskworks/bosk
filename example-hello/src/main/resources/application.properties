spring.application.name=hello
server.port=1740
bosk.web-api.maintenance.access=BEARER
bosk.web-api.maintenance.path=/bosk/state

# The maintenance endpoints authenticate with a bearer token.
# A real application would use OAuth2 or another token issuer; this is a placeholder.
# The value is a comma-separated list so tokens can be rotated with an overlap.
example.security.tokens=${EXAMPLE_SECURITY_TOKENS:example-bearer-token}

# Now that we use this in unit tests, quiet down the logging
spring.main.banner-mode=off
