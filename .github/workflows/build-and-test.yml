# Based on:
# - https://github.com/assertj/assertj/blob/f08f94806675ccaaa347e4cbc56cf02efa8cd3be/.github/workflows/release.yml#L1
# - https://github.com/testcontainers/testcontainers-java/blob/de20484e53eb8d1f580b74ff9df31261b596ab5c/.github/workflows/release.yml#L1

name: "Build and test"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_test:

    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # for upload-artifact

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          # First version is for Bosk to use, and the second is for Gradle
          java-version: |
            26
            25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false # OR: ${{ github.ref != 'refs/heads/develop' }}

      - name: Run Gradle Test
        run: |
          set +e
          EXPERIMENT_DIR=build/reports/experiment
          mkdir -p "$EXPERIMENT_DIR"
          {
            echo "=== HOST FACTS ($(date -u +%Y-%m-%dT%H:%M:%SZ)) ==="
            echo "nproc: $(nproc)"
            grep -m1 -E "model name|Processor|Machine" /proc/cpuinfo 2>/dev/null
            lscpu 2>/dev/null | grep -Ei "architecture|model name" 
            echo "cpu cores: $(nproc)"
            free -h
            uname -r
            echo "loadavg: $(cat /proc/loadavg)"
          } > "$EXPERIMENT_DIR/host-facts.txt" 2>&1

          (
            prev_ts=""
            prev_ns=0
            while true; do
              ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              now_ns=$(date +%s%N)
              gap=""
              if [ -n "$prev_ts" ]; then
                gap=$(( (now_ns - prev_ns) / 1000000 ))ms
              fi
              prev_ts=$ts
              prev_ns=$now_ns
              {
                echo "=== [tick $ts] gap=$gap ==="
                echo "loadavg: $(cat /proc/loadavg)"
                echo "runnable-threads: $(ps -eL -o stat= | grep -c '^R')"
                echo "gradle-workers: $(pgrep -fc GradleWorkerMain 2>/dev/null)"
                echo "--- mongod procs ---"
                ps -C mongod -o pid=,pcpu=,pmem=,etime= 2>/dev/null
                echo "--- docker ps ---"
                docker ps --format '{{.ID}} {{.Names}} {{.Ports}} {{.RunningFor}}'
                echo "--- docker stats ---"
                docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}'
                for c in $(docker ps -q); do
                  name=$(docker inspect -f '{{.Name}}' "$c" 2>/dev/null | tr -d '/')
                  [ -z "$name" ] && name=$c
                  if docker inspect -f '{{json .Config.ExposedPorts}}' "$c" 2>/dev/null | grep -q '27017/tcp'; then
                    echo "--- [$name] exec-true (pure host scheduling) ---"
                    { time -p docker exec "$c" true; } 2>&1 | sed "s/^/    /"
                    echo "--- [$name] currentOp ---"
                    { time -p docker exec "$c" mongosh --quiet --eval 'db.currentOp({$or:[{waitingForLock:true},{secs_running:{$gt:0}}]})'; } 2>&1 | sed "s/^/    /"
                    echo "--- [$name] serverStatus ---"
                    { time -p docker exec "$c" mongosh --quiet --eval 'var s=db.serverStatus();print(JSON.stringify({globalLockQueue:s.globalLock.currentQueue,opcounters:s.opcounters,connections:s.connections}))'; } 2>&1 | sed "s/^/    /"
                  fi
                done
              } >> "$EXPERIMENT_DIR/load-samples.tsv" 2>&1
              sleep 10
            done
          ) &
          SAMPLER_PID=$!

          (
            while true; do
              for c in $(docker ps -q); do
                name=$(docker inspect -f '{{.Name}}' "$c" 2>/dev/null | tr -d '/')
                [ -z "$name" ] && name=$c
                docker logs --since 120s -t "$c" 2>/dev/null | sed "s/^/[$name] /" >> "$EXPERIMENT_DIR/mongo-logs.txt"
              done
              sleep 5
            done
          ) &
          LOGS_PID=$!

          ./gradlew :bosk-mongo:test
          RC=$?

          kill $SAMPLER_PID $LOGS_PID 2>/dev/null
          sleep 2
          {
            echo "=== FINAL ($(date -u +%Y-%m-%dT%H:%M:%SZ)) ==="
            cat /proc/loadavg
            ps -C mongod -o pid=,pcpu=,etime= 2>/dev/null
            docker ps -a --format '{{.ID}} {{.Names}} {{.Status}}'
          } >> "$EXPERIMENT_DIR/load-samples.tsv" 2>&1

          exit $RC
        env:
          ORG_GRADLE_PROJECT_ossrhUsername: ${{secrets.OSSRH_USERNAME}}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{secrets.OSSRH_TOKEN}}
          ORG_GRADLE_PROJECT_signingKey: ${{secrets.GPG_PRIVATE_KEY}}
          ORG_GRADLE_PROJECT_signingPassword: ${{secrets.GPG_PASSWORD}}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: reports
          path: "**/build/reports/"
