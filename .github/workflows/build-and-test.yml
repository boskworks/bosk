# Based on:
# - https://github.com/assertj/assertj/blob/f08f94806675ccaaa347e4cbc56cf02efa8cd3be/.github/workflows/release.yml#L1
# - https://github.com/testcontainers/testcontainers-java/blob/de20484e53eb8d1f580b74ff9df31261b596ab5c/.github/workflows/release.yml#L1

name: "Build and test"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_test:

    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          # First version is for Bosk to use, and the second is for Gradle
          java-version: |
            27
            25

      - uses: gradle/actions/setup-gradle@v6

      # Compile everything and run the static analysis first, so a failure there
      # doesn't cost us the test time. This also compiles the test classes,
      # including bosk-mongo's, so the test invocations below don't have to.
      - name: Build
        run: ./gradlew check -x test

      # Everything except the Mongo suite. These tests are happy to run
      # alongside each other.
      - name: Test
        run: ./gradlew test -x :bosk-mongo:test

      # Run the Mongo suite on its own so load from other tests doesn't cause
      # spurious timeouts. Without the configuration cache, --no-parallel would do
      # this, but that flag has no effect with the configuration cache enabled,
      # so we isolate the Mongo suite with a separate Gradle invocation.
      - name: Test (Mongo)
        run: ./gradlew :bosk-mongo:test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: "**/build/reports/"
