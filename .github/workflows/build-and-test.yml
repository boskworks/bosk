# Based on:
# - https://github.com/assertj/assertj/blob/f08f94806675ccaaa347e4cbc56cf02efa8cd3be/.github/workflows/release.yml#L1
# - https://github.com/testcontainers/testcontainers-java/blob/de20484e53eb8d1f580b74ff9df31261b596ab5c/.github/workflows/release.yml#L1

name: "Build and test"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_test:

    # Isolate the Testcontainers-heavy suites (Mongo and SQL) onto their own
    # runner VMs. The Mongo tests use a deliberately short timeout, and running
    # the whole check on one VM lets the SQL tests' Postgres container and the
    # other test JVMs starve the mongod container enough to trip that timeout.
    name: "[${{ matrix.group }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [mongo, sql, other]
        include:
          - group: mongo
            gradle: ":bosk-mongo:check"
          - group: sql
            gradle: ":bosk-sql:check"
          - group: other
            gradle: "check -x :bosk-mongo:check -x :bosk-sql:check"
    permissions:
      contents: read
      actions: write # for upload-artifact

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          # First version is for Bosk to use, and the second is for Gradle
          java-version: |
            26
            25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false # OR: ${{ github.ref != 'refs/heads/develop' }}

      - name: Run Gradle Test
        run: |
          ./gradlew ${{ matrix.gradle }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-${{ matrix.group }}
          path: "**/build/reports/"

  # A single summary job named "Build and test" that the branch protection
  # rules require as a check. It passes only when every group above passed.
  build_and_test_summary:
    name: Build and test
    needs: build_and_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify that all test groups passed
        run: |
          if [ "${{ needs.build_and_test.result }}" != "success" ]; then
            echo "::error::One or more test groups failed"
            exit 1
          fi
          echo "All test groups passed"
