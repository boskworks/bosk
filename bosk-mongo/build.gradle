
dependencies {
	api project(":bosk-core")
	api libs.mongodb
	testImplementation libs.testcontainers.mongodb


	// Allows us to annotate status objects so they're handy to serialize with jackson
	implementation platform(libs.jackson.bom)
	implementation libs.jackson.annotations

	testImplementation project(":bosk-junit")
	testImplementation project(":bosk-logback")
	testImplementation project(":bosk-testing")
}

tasks.named('test') {
	// maxParallelForks spreads the Mongo tests across several JVMs, each of
	// which starts its own MongoDB and toxiproxy containers (MongoService's
	// containers are static, hence per-JVM). We deliberately keep a single JVM:
	// the parallel MongoDB containers overload the CI machine, which would force
	// us to increase the deliberately short Mongo timeout, slowing down the tests
	// for developers.
	maxParallelForks = 1

	// TEMPORARY: force re-execution on every CI run so we can measure the
	// flake rate of the mongo tests. Revert this after the experiment.
	outputs.cacheIf { false }
}
