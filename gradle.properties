org.gradle.caching=true
org.gradle.configuration-cache=true

# Runs the sub-projects' tasks in parallel with each other. We deliberately keep
# this off: parallel execution risks slowing down the Mongo tests, which use a
# deliberately short timeout and might then time out.
org.gradle.parallel=false

# If you bump these, change the CI workflows too
jdkVersion=26
minSupportedJavaVersion=25
