
configurations {
	testImplementation {
		// Spring Boot's test starters bring in Mockito, but we don't use it.
		// Its mere presence triggers Mockito's self-attach warning and a JVM
		// class-data-sharing warning, so exclude it to keep test output clean.
		exclude group: 'org.mockito'
	}
}

dependencies {
	api project(":bosk-jackson")
	implementation libs.spring.boot.starter.webmvc

	// compileOnly: don't drag the MongoDB driver into applications that don't use it
	compileOnly project(":bosk-mongo")
	compileOnly libs.spring.boot.mongodb
	testImplementation project(":bosk-mongo")
	testImplementation libs.spring.boot.mongodb

	// compileOnly: Spring Security is optional; the maintenance endpoints work without it
	compileOnly libs.spring.security.config
	compileOnly libs.spring.security.core
	compileOnly libs.spring.security.web
	testImplementation libs.spring.boot.starter.security
	testImplementation libs.spring.boot.starter.oauth2.resource.server
	testImplementation libs.spring.security.test

	testImplementation libs.spring.boot.starter.test
	testImplementation libs.spring.boot.starter.webmvc.test
	annotationProcessor libs.spring.boot.annotation.processor
	testImplementation project(":bosk-testing")
}
